name: Supabase Project Keepalive

on:
  schedule:
    # Run every 3 days at 04:00 UTC to prevent Supabase free tier inactivity pause
    - cron: '0 4 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase REST Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health/REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is not set!"
            exit 1
          fi
          echo "Pinging Supabase REST health endpoint..."
          curl -f -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/" || exit 1
          echo "Supabase keepalive ping successful."
